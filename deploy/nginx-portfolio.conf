# Nginx virtual host for the cybersecurity portfolio.
# Save to /etc/nginx/sites-available/portfolio and symlink into sites-enabled.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Maximum upload size — must be >= Flask MAX_UPLOAD_MB and PDF cap (100 MB).
    client_max_body_size 110M;

    # Security: hide nginx version.
    server_tokens off;

    # Static files served directly by Nginx (fast, no Python overhead).
    location /static/ {
        alias /var/www/portfolio/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded media (admin-managed images + books).
    location /uploads/ {
        alias /var/www/portfolio/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        # Never execute anything from uploads; serve as static only.
        types { }
        default_type application/octet-stream;
    }

    # Proxy everything else to Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Streaming-friendly timeouts.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Deny access to hidden files.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# --------------------------------------------------------------------------
# HTTPS (recommended) — enable after obtaining a certificate with Certbot:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot auto-inserts the listen 443 / ssl_ directives. Keep the above
# server block and let Certbot add the TLS server block.
# --------------------------------------------------------------------------
